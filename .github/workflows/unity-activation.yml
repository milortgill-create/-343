name: Unity Activation

# Получает файл активации лицензии Unity (.alf).
#
# Как пользоваться:
#   1. Actions → «Unity Activation» → Run workflow (нужны секреты UNITY_EMAIL и UNITY_PASSWORD)
#   2. Скачать артефакт Unity_v2022.3.22f1.alf
#   3. Открыть https://license.unity3d.com/manual и загрузить этот .alf
#   4. Скачать выданный Unity_v2022.3.22f1.ulf
#   5. Положить ВЕСЬ текст .ulf в секрет UNITY_LICENSE
#      (Settings → Secrets and variables → Actions → New repository secret)
#   6. Запустить «Android APK»

on:
  workflow_dispatch:

jobs:
  activation:
    name: Запрос файла активации (.alf)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Запросить .alf у Unity
        uses: game-ci/unity-request-activation-file@v2
        id: request
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Показать, что получилось
        run: |
          ls -la *.alf || true
          echo "Дальше: скачайте артефакт ниже и загрузите его на https://license.unity3d.com/manual"

      - name: Артефакт .alf
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: '*.alf'
          if-no-files-found: warn
          retention-days: 7
